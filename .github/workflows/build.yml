name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ae2
            args: '-Pextendedae_version=1.20-1.4.18-forge'
          - name: uelm
            args: '-Pae2_uelm_version=15.5.4-uelm -Pextendedae_version=1.20-1.4.18-forge'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout matching Forge prerequisite
        uses: actions/checkout@v4
        with:
          repository: AyaYumi/AppliedEnhancements
          ref: 83c9052851487172fd75b4fd45dc3b168d05e74f
          path: .dependencies/appliedenhancements
      - name: Build shared prerequisite against upstream AE2
        run: |
          bash .dependencies/appliedenhancements/gradlew -p .dependencies/appliedenhancements build apiJavadoc --console=plain
          mkdir -p libs
          cp .dependencies/appliedenhancements/build/libs/appliedenhancements-1.1.0-forge.jar libs/
      - name: Validate resources and documentation
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path.cwd()
          for source in (root / 'src/main/resources').rglob('*'):
              if source.suffix in ('.json', '.mcmeta'):
                  json.loads(source.read_text(encoding='utf-8'))
          docs = list((root / 'docs').glob('*.md')) + [root / 'README.md', root / 'README.zh-CN.md']
          for source in docs:
              for target in re.findall(r'\]\(([^)]+)\)', source.read_text(encoding='utf-8')):
                  target = target.strip('<>').split('#', 1)[0]
                  if target and not re.match(r'[a-zA-Z][a-zA-Z0-9+.-]*:', target) and not (source.parent / target).exists():
                      raise SystemExit(f'{source}: missing {target}')
      - name: Build, test and API documentation
        run: bash gradlew ${{ matrix.args }} build apiJavadoc --console=plain
      - name: Paired AE2 compatibility and long batches
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/ae2-compat.init.gradle runGameTestServer --console=plain
      - name: Recipes, buffers and protected multiblocks
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/gametest.init.gradle runGameTestServer --console=plain
      - name: Singularity construction and motion
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/singularity.init.gradle runGameTestServer --console=plain
      - name: Saved state, dismantling and legacy upgrades
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/maintenance.init.gradle runGameTestServer --console=plain
      - name: AdvancedAE batch acceptance and ownership
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/aae.init.gradle runGameTestServer --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnisequence-2.0.7-forge-${{ matrix.name }}
          path: |
            build/libs/*.jar
            build/docs/api/
            build/reports/tests/test/
            build/*/logs/latest.log
