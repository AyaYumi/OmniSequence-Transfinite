name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/forge_gradle/maven_downloader/net/minecraftforge/forge

      - name: Clear cached ForgeGradle downloads
        run: rm -rf "$GRADLE_USER_HOME/caches/forge_gradle/maven_downloader/net/minecraftforge/forge"

      - name: Build with Gradle
        run: ./gradlew build
