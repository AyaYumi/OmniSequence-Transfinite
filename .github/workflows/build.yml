name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ae2
            args: '-Pextendedae_version=1.20-1.4.19-forge'
          - name: uelm
            args: '-Pae2_uelm_version=15.5.4-uelm -Pextendedae_version=1.20-1.4.19-forge'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout matching Forge prerequisite
        uses: actions/checkout@v4
        with:
          repository: AyaYumi/AppliedEnhancements
          ref: 3616345407ac9fabbe1335e73f333cbfb7635a25
          path: .dependencies/appliedenhancements
      - name: Build shared prerequisite against upstream AE2
        run: |
          python - <<'PY'
          from pathlib import Path
          def version(path, key):
              return next(line.split('=', 1)[1].strip() for line in Path(path).read_text().splitlines() if line.startswith(key + '='))
          expected = version('gradle.properties', 'applied_enhancements_version')
          actual = version('.dependencies/appliedenhancements/gradle.properties', 'mod_version')
          if actual != expected:
              raise SystemExit(f'Pinned Forge prerequisite is {actual}, expected {expected}')
          PY
          bash .dependencies/appliedenhancements/gradlew -p .dependencies/appliedenhancements build apiJavadoc --console=plain
          mkdir -p libs
          cp .dependencies/appliedenhancements/build/libs/appliedenhancements-1.1.1-forge.jar libs/
      - name: Validate repository files and public documentation
        run: python .github/scripts/check_repository.py

      - name: Build, test and API documentation
        run: bash gradlew ${{ matrix.args }} build apiJavadoc --console=plain
      - name: Paired AE2 compatibility and long batches
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/ae2-compat.init.gradle runGameTestServer --console=plain
      - name: Recipes, buffers and protected multiblocks
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/gametest.init.gradle runGameTestServer --console=plain
      - name: Singularity construction and motion
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/singularity.init.gradle runGameTestServer --console=plain
      - name: Saved state, dismantling and legacy upgrades
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/maintenance.init.gradle runGameTestServer --console=plain
      - name: AdvancedAE batch acceptance and ownership
        run: bash gradlew ${{ matrix.args }} -I tools/gametest/aae.init.gradle runGameTestServer --console=plain
      - name: New 2.0.9 behavior and ownership regressions
        run: |
          for suite in auto-crafting fabrication-dispatch outer-wilds compact-singularity cosmic-holes catalyst-sharing fabrication-upload cpu-batch-compat performance-regression cyclic-submission byproduct-submission applied-110; do
            bash gradlew ${{ matrix.args }} -I tools/gametest/$suite.init.gradle runGameTestServer --console=plain
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnisequence-2.0.9-forge-${{ matrix.name }}
          path: |
            build/libs/*.jar
            build/docs/api/
            build/reports/tests/test/
            build/*/logs/latest.log
