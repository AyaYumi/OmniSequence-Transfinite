name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      applied_enhancements_jar_url:
        description: Matching revised AppliedEnhancements 1.1.1 artifact URL
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate documentation and JSON resources
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path.cwd()
          failures = []
          for source in (root / "src/main/resources").rglob("*"):
              if source.suffix in (".json", ".mcmeta"):
                  try:
                      json.loads(source.read_text(encoding="utf-8"))
                  except (ValueError, UnicodeError) as error:
                      failures.append(f"{source.relative_to(root)}: {error}")
          docs = list((root / "docs").glob("*.md"))
          docs += list((root / "src/main/resources/assets/molecularmanipulator/ae2guide").rglob("*.md"))
          docs += [root / name for name in ("README.md", "README.zh-CN.md", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md", "libs/README.md", "tools/gametest/README.md", "tools/textures/README.md")]
          for source in docs:
              for target in re.findall(r"\]\(([^)]+)\)", source.read_text(encoding="utf-8")):
                  target = target.strip("<>").split("#", 1)[0]
                  if not target or re.match(r"[a-zA-Z][a-zA-Z0-9+.-]*:", target):
                      continue
                  if not (source.parent / target).exists():
                      failures.append(f"{source.relative_to(root)}: missing {target}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated JSON resources and {len(docs)} documentation files")

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      APPLIED_ENHANCEMENTS_JAR_URL: ${{ inputs.applied_enhancements_jar_url || vars.APPLIED_ENHANCEMENTS_JAR_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout matching prerequisite source
        if: env.APPLIED_ENHANCEMENTS_JAR_URL == ''
        uses: actions/checkout@v4
        with:
          repository: AyaYumi/AppliedEnhancements
          ref: 4bf82cabc9e2caa30ddb7731f0ec5458c2f10c7a
          path: .build-dependencies/appliedenhancements
          persist-credentials: false

      - name: Build matching prerequisite
        if: env.APPLIED_ENHANCEMENTS_JAR_URL == ''
        shell: bash
        run: |
          bash .build-dependencies/appliedenhancements/gradlew -p .build-dependencies/appliedenhancements jar --no-configuration-cache
          mkdir -p libs
          cp .build-dependencies/appliedenhancements/build/libs/appliedenhancements-1.1.1.jar libs/

      - name: Use explicit prerequisite artifact
        if: env.APPLIED_ENHANCEMENTS_JAR_URL != ''
        shell: bash
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 "$APPLIED_ENHANCEMENTS_JAR_URL" -o libs/appliedenhancements-1.1.1.jar

      - name: Build and generate API docs
        run: bash gradlew --no-configuration-cache build apiJavadoc

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnisequence-2.0.8
          path: |
            build/libs/*.jar
            build/docs/api/
            build/reports/tests/test/
