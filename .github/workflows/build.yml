name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-excludes: |
            caches/forge_gradle/maven_downloader

      - name: Clear cached ForgeGradle downloads
        run: rm -rf "$GRADLE_USER_HOME/caches/forge_gradle/maven_downloader"

      - name: Checkout Forge planner dependency
        uses: actions/checkout@v4
        with:
          repository: AyaYumi/AppliedEnhancements
          ref: 1.20.1-forge
          path: .dependencies/appliedenhancements

      - name: Build Forge planner dependency
        run: |
          if ! grep -Eq '^minecraft_version=1\.20\.1[[:space:]]*$' .dependencies/appliedenhancements/gradle.properties; then
            echo "::error::AppliedEnhancements 1.20.1-forge does not yet contain the Forge 1.20.1 port. Publish that dependency branch before running this build."
            exit 1
          fi
          chmod +x .dependencies/appliedenhancements/gradlew
          .dependencies/appliedenhancements/gradlew -p .dependencies/appliedenhancements build
          mkdir -p libs
          cp .dependencies/appliedenhancements/build/libs/appliedenhancements-1.0.6-forge.jar libs/

      # 1.4.18 is published on Modrinth. The local integration pack uses 1.4.19.
      - name: Build with Gradle
        run: ./gradlew build -Pextendedae_version=1.20-1.4.18-forge
