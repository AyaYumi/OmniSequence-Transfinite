name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ae2
            args: ''
          - name: uelm
            args: '-Pae2_uelm_version=15.5.4-uelm'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Checkout matching Forge prerequisite
        uses: actions/checkout@v4
        with:
          repository: AyaYumi/AppliedEnhancements
          ref: ab7fb661d2a5d07303e0f7bd343e61a491418281
          path: .dependencies/appliedenhancements
      - name: Build shared prerequisite against upstream AE2
        run: |
          python - <<'PY'
          from pathlib import Path
          def version(path, key):
              return next(line.split('=', 1)[1].strip() for line in Path(path).read_text().splitlines() if line.startswith(key + '='))
          expected = version('gradle.properties', 'applied_enhancements_api_build')
          actual = version('.dependencies/appliedenhancements/gradle.properties', 'mod_version')
          if actual != expected:
              raise SystemExit(f'Pinned Forge prerequisite is {actual}, expected build API {expected}')
          PY
          bash .dependencies/appliedenhancements/gradlew -p .dependencies/appliedenhancements build apiJavadoc --console=plain
          mkdir -p libs
          cp .dependencies/appliedenhancements/build/libs/appliedenhancements-1.1.4-forge.jar libs/
      - name: Validate repository files and public documentation
        run: python .github/scripts/check_repository.py
      - name: Build, test and API documentation
        run: bash gradlew ${{ matrix.args }} build apiJavadoc --console=plain
      - name: Native batches, fabrication, research and Singularity regressions
        run: |
          for suite in cpu performance fabrication research singularity singularity-unload; do
            bash gradlew ${{ matrix.args }} -PgameTestSuite=$suite runGameTestServer --console=plain | tee build/ci-$suite.log
            grep -Eq 'All [1-9][0-9]* required tests passed' build/ci-$suite.log
          done
      - name: Compile actual ECO API fixtures
        # NeoECOAE 20.5.0 initializes a client-only UI on dedicated servers.
        # Runtime ECO assertions must run in a client/integrated-server environment.
        run: |
          for suite in eco eco-legacy; do
            bash gradlew ${{ matrix.args }} -PgameTestSuite=$suite compileGameTestJava --console=plain
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnisequence-forge-${{ matrix.name }}
          path: |
            build/libs/*.jar
            build/docs/api/
            build/reports/tests/test/
            build/ci-*.log
            build/gametest-*/logs/latest.log
