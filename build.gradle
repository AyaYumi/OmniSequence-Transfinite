plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_artifact_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file(findProperty('run_directory') ?: 'run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// MixinGradle writes outside JavaCompile's normal output directories. Keep those
// outputs tracked and run the processor over all mixins when Java sources change.
def mixinRefmap = layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json")
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.files(mixinRefmap,
            layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'),
            layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
}
tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')
    from(mixinRefmap)
}
tasks.withType(Jar).configureEach {
    // MixinGradle also contributes the same generated file directly to reobfuscated jars.
    filesMatching("${mod_id}.refmap.json") { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
}

jarJar.enable()

tasks.named('jarJar', Jar).configure {
    archiveClassifier = project.hasProperty('ae2_uelm_version') ? 'uelm' : ''
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
    from('docs') {
        include 'README.md', 'matter-research-api.md', 'matter-research-api.zh-CN.md',
                'omni-batch-provider-api.md', 'omni-batch-provider-api.zh-CN.md', 'omni-exact-provider-api.md',
                'recipe-permissions.zh-CN.md', 'star-research-nodes.zh-CN.md',
                'star-orrery-upgrades.md', 'star-orrery-upgrades.zh-CN.md'
        into 'docs'
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
    exclude 'assets/examplemod/**'
}

repositories {
    flatDir { dirs 'libs' }

    maven {
        name = 'AE2UELM'
        url = 'https://repo.expandium.net/releases'
        content { includeGroup 'appeng' }
    }

    maven {
        name = 'MinecraftForgeReleases'
        url = 'https://maven.minecraftforge.net/releases/'
        content { includeGroup 'net.minecraftforge' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'org.appliedenergistics' }
    }
    maven {
        name = 'JaredMaven'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    mavenCentral()
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Use exactly one AE2 implementation on both compile and runtime classpaths.
    // A module coordinate lets ForgeGradle remap the production UELM jar.
    implementation fg.deobf(project.hasProperty('ae2_uelm_version')
            ? "appeng:appliedenergistics2-forge:${project.property('ae2_uelm_version')}"
            : "maven.modrinth:ae2:${ae2_version}")
    implementation fg.deobf("maven.modrinth:glodium:${glodium_version}")
    // The pinned Forge 1.4.20 release is published on CurseForge, not Modrinth Maven.
    implementation fg.deobf("curse.maven:extendedae-892005:${extendedae_curse_file}")
    compileOnly fg.deobf("maven.modrinth:neoecoae:${neoeco_api_build}")
    implementation fg.deobf("maven.modrinth:guideme:${guideme_version}")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")

    // Separate required mods. Deobfuscate published Forge jars for development.
    implementation fg.deobf("com.appliedenhancements:appliedenhancements:${applied_enhancements_api_build}")

    testImplementation fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    testImplementation "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    localRuntime "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    jarJar("io.github.llamalad7:mixinextras-forge:[${mixinextras_version},)") {
        jarJar.pin(it, mixinextras_version)
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            applied_enhancements_version: applied_enhancements_version,
            neoeco_version: neoeco_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors,
                'MixinConfigs'           : "${mod_id}.mixins.json",
        ])
    }

    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
    from('docs') {
        include 'README.md', 'matter-research-api.md', 'matter-research-api.zh-CN.md',
                'omni-batch-provider-api.md', 'omni-batch-provider-api.zh-CN.md', 'omni-exact-provider-api.md',
                'recipe-permissions.zh-CN.md', 'star-research-nodes.zh-CN.md',
                'star-orrery-upgrades.md', 'star-orrery-upgrades.zh-CN.md'
        into 'docs'
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000', '-Xdiags:verbose']
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
    exclude '**/*.bak', '**/*.old', '**/*.tmp', '**/*.log', '**/*~',
            '**/*.bbmodel', '**/*.psd', '**/*.xcf', '**/*.blend',
            '**/.DS_Store', '**/Thumbs.db', '**/desktop.ini'
}

// Optional CPU contracts are Java 17 ABI declarations, never runtime implementations.
// Keep the declaration output off runtime classpaths and out of every distributable.
def optionalCpuApi = sourceSets.create('optionalCpuApi') {
    java.srcDir 'src/optionalCpuApi/java'
    compileClasspath = sourceSets.main.compileClasspath
}
sourceSets.main.compileClasspath += optionalCpuApi.output

// Fail clearly before compiling against an older local prerequisite.
def verifyAppliedEnhancementsApi = tasks.register('verifyAppliedEnhancementsApi') {
    def dependencyJar = layout.projectDirectory.file("libs/appliedenhancements-${applied_enhancements_api_build}.jar")
    inputs.file(dependencyJar)
    doLast {
        def jarFile = dependencyJar.asFile
        if (!jarFile.isFile()) {
            throw new GradleException("Missing AppliedEnhancements dependency: " + jarFile + ". See libs/README.md")
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            if (archive.getEntry('com/appliedenhancements/api/AelisBatchExecutionContext.class') == null
                    || archive.getEntry('com/appliedenhancements/api/AelisSmartDoublingApi.class') == null
                    || archive.getEntry('com/appliedenhancements/api/AelisExactCraftingPlanApi.class') == null) {
                throw new GradleException('The AppliedEnhancements JAR lacks the required transaction/smart-doubling/exact-plan API. See libs/README.md')
            }
        }
    }
}
tasks.named('compileJava').configure { dependsOn verifyAppliedEnhancementsApi }

tasks.named('compileTestJava', JavaCompile).configure {
    classpath += sourceSets.main.compileClasspath
}
tasks.named('test', Test).configure {
    useJUnitPlatform()
    classpath += sourceSets.main.compileClasspath
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Both distributable jars must use Forge runtime names.
reobf { jarJar {} }
tasks.named("jarJar").configure { finalizedBy "reobfJarJar" }
tasks.named("build").configure { dependsOn "jarJar" }

// Development runs use named Minecraft classes and can hide a missing refmap link.
// Validate the reobfuscated distributable, rather than only compiler output.
def verifyReleaseMixins = tasks.register('verifyReleaseMixins') {
    dependsOn tasks.named('reobfJarJar')
    def releaseJar = tasks.named('jarJar', Jar).flatMap { it.archiveFile }
    inputs.file(releaseJar)
    doLast {
        new java.util.zip.ZipFile(releaseJar.get().asFile).withCloseable { archive ->
            def apiDocs = ['README.md', 'matter-research-api.md', 'matter-research-api.zh-CN.md',
                    'omni-batch-provider-api.md', 'omni-batch-provider-api.zh-CN.md', 'omni-exact-provider-api.md',
                    'recipe-permissions.zh-CN.md', 'star-research-nodes.zh-CN.md',
                    'star-orrery-upgrades.md', 'star-orrery-upgrades.zh-CN.md']
            def packagedDocs = archive.entries().toList().findAll { !it.directory && it.name.startsWith('docs/') }
                    .collect { it.name.substring('docs/'.length()) }
            if (packagedDocs.toSet() != apiDocs.toSet())
                throw new GradleException('Release docs must contain only the complete public API documentation')
            def forbidden = ['cn/dancingsnow/neoecoae/', 'com/moakiee/thunderbolt/',
                    'com/fish_dan_/data_energistics/', 'com/atir/molecularmanipulator/verification/']
            if (archive.entries().toList().any { entry -> forbidden.any { prefix -> entry.name.startsWith(prefix) } })
                throw new GradleException('Optional ABI declarations or test fixtures leaked into the release JAR')
            def parser = new groovy.json.JsonSlurper()
            def config = parser.parse(archive.getInputStream(archive.getEntry("${mod_id}.mixins.json")), 'UTF-8')
            def refmapName = "${mod_id}.refmap.json"
            if (config.refmap != refmapName || archive.getEntry(refmapName) == null) {
                throw new GradleException('Release Mixin configuration must reference the packaged Forge refmap')
            }
            def refmap = parser.parse(archive.getInputStream(archive.getEntry(refmapName)), 'UTF-8')
            [
                'EcoOmniPlanMenuMixin': ['broadcastChanges', 'm_38946_'],
                'SingularityEntityCollisionMixin': ['tick', 'm_8119_'],
                'SingularityPlayerCarriageMixin': ['tick', 'm_9933_'],
                'ForgeMachineRecipeJsonMixin': ['apply', 'm_5787_'],
                'ResponsiveScreenBackgroundMixin': ['renderBackground', 'm_280273_'],
                'RecipeManagerAccessor': ['byName', 'f_199900_'],
                'GravityCameraMixin': ['setRotation(FF)V', 'm_90572_'],
                'GravityGameRendererMixin': ['renderLevel', 'm_109089_'],
                'GravityEntityMixin': ['canEnterPose', 'm_20175_'],
                'GravityLivingMotionMixin': ['travel', 'm_7023_'],
                'GravityPlayerRendererMixin': ['setupRotations', 'm_7523_'],
                'GhostMatterDamageMixin': ['handleDamageEvent', 'm_269138_'],
                'GhostMatterLocalHealthMixin': ['hurtTo', 'm_108760_']
            ].each { mixin, target ->
                def mapping = refmap.mappings["com/atir/molecularmanipulator/mixin/${mixin}"]?[target[0]]
                if (!(mapping instanceof String) || !mapping.contains(target[1])) {
                    throw new GradleException("Missing production Forge mapping for ${mixin}.${target[0]}")
                }
            }
        }
    }
}
tasks.named('check').configure { dependsOn verifyReleaseMixins }

// Disposable server regressions; these classes and fixtures never enter a release JAR.
def gameTestSuite = providers.gradleProperty('gameTestSuite').getOrElse('cpu')
def gameTestSuites = [
        cpu: ['MatterCpuBatchGameTests', 'MatterNativeCpuChecks'],
        adaptive: ['AdaptiveDispatchGameTests'],
        performance: ['MatterRecipeLookupGameTests', 'MatterAEKeyGameTests', 'MolecularLongBatchGameTests',
                      'TransfiniteComputeNexusGameTests', 'MolecularCenterPatternPortGameTests'],
        fabrication: ['MolecularAutoCraftGameTests', 'MolecularAutoCrafterRemovalGameTests', 'MatterAssemblyDispatchGameTests'],
        patterns: ['MolecularCenterPatternMigrationGameTests', 'MolecularCenterNativePatternUploadGameTests'],
        'singularity-quantum': ['SingularityQuantumLinkGameTests'],
        'singularity-menu': ['SingularityMenuSyncGameTests'],
        'fabrication-upload': ['MatterFabricationNetworkUploadGameTests'],
        machines: ['MatterMachineCompatibilityGameTests'],
        research: ['ResearchStockGameTests'],
        singularity: ['SingularityPaletteGameTests', 'SingularityConstructionGameTests', 'SingularityMotionGameTests',
                      'SingularityEmbeddingGameTests', 'SingularitySuspendedGameTests', 'CosmicSingularityGameTests',
                      'CompactSingularityGameTests'],
        'singularity-unload': ['SingularityChunkLoadingGameTests'],
        essence: ['MolecularReusableCraftingGameTests'],
        'native-essence': ['MolecularReusableCraftingGameTests'],
        eco: ['EcoCpuGameTests', 'EcoMatterGameTests', 'EcoOutputGameTests', 'EcoOmniParentOrderGameTests', 'EcoOmniMenuGameTests'],
        'eco-legacy': ['MatterCpuBatchGameTests', 'MatterNativeCpuChecks', 'LegacyEcoCpuGameTests']
]
if (!gameTestSuites.containsKey(gameTestSuite)) throw new GradleException("Unknown gameTestSuite: ${gameTestSuite}")
if (gameTestSuite == 'patterns') {
    if (project.hasProperty('gameTestPatternCluster'))
        gameTestSuites.patterns += ['MolecularCenterClusterMigrationGameTests']
    if (project.hasProperty('gameTestPatternStorageJar'))
        gameTestSuites.patterns += ['MolecularCenterAddonCellMigrationGameTests']
}
def gameTests = sourceSets.create('gameTest') {
    java.setSrcDirs(['src/gameTest/java'])
    java.setIncludes((gameTestSuites[gameTestSuite] + ['VerificationAEKey', 'RegressionConfigFixture'])
            .collect { "**/${it}.java" })
    resources.setSrcDirs(['src/gameTest/resources'])
    if (gameTestSuite == 'fabrication-upload') {
        resources.exclude 'data/molecularmanipulator/recipes/verification_ae_inputs.json'
    } else if (!(gameTestSuite in ['cpu', 'performance', 'eco', 'eco-legacy'])) {
        resources.exclude 'data/molecularmanipulator/recipes/**'
    }
    // The old CPU fixture must compile against its real API, not the newer compatibility aliases.
    compileClasspath += sourceSets.main.compileClasspath.filter {
        gameTestSuite != 'eco-legacy' || !it.name.startsWith('neoecoae-')
    } + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}
// Forge scans every class in the mod output, including leftovers from another suite.
// Keep each optional fixture selection isolated instead of accidentally rerunning stale tests.
def gameTestVariant = gameTestSuite + (project.hasProperty('gameTestPatternCluster') ? '-cluster' : '') +
        (project.hasProperty('gameTestPatternStorageJar') ? '-storage' : '')
gameTests.java.destinationDirectory.set(layout.buildDirectory.dir("classes/java/gameTest-${gameTestVariant}"))
gameTests.output.classesDirs.setFrom(gameTests.java.classesDirectory)
gameTests.output.resourcesDir = layout.buildDirectory.dir("resources/gameTest-${gameTestVariant}").get().asFile
tasks.named('processGameTestResources', ProcessResources).configure {
    destinationDir = gameTests.output.resourcesDir
}
def gameTestDirectory = layout.buildDirectory.dir(providers.gradleProperty('gameTestRunName')
        .getOrElse("gametest-${gameTestSuite}"))
minecraft.runs.gameTestServer {
    workingDirectory gameTestDirectory.get().asFile
    mods { "${mod_id}" { source gameTests } }
}
if (project.hasProperty('gameTestEco') || gameTestSuite in ['eco', 'eco-legacy', 'essence']
        || (gameTestSuite == 'patterns' && project.hasProperty('gameTestPatternCluster'))) {
    def ecoRuntime = providers.gradleProperty('gameTestEcoVersion')
            .getOrElse(gameTestSuite == 'eco-legacy' ? neoeco_version : neoeco_api_build)
    // Use NeoECOAE's project ID so ForgeGradle can remap an older runtime alongside the newer API.
    def ecoRuntimeDependency = "maven.modrinth:udZtKfzP:${ecoRuntime}"
    dependencies.add('localRuntime', fg.deobf(ecoRuntimeDependency))
    if (gameTestSuite == 'eco-legacy')
        dependencies.add('gameTestCompileOnly', fg.deobf(ecoRuntimeDependency))
    dependencies.add('localRuntime', fg.deobf('maven.modrinth:ldlib:mc1.20.1-1.0.52.a-forge'))
    dependencies.add('gameTestCompileOnly', fg.deobf('maven.modrinth:ldlib:mc1.20.1-1.0.52.a-forge'))
}
if (gameTestSuite == 'patterns' && project.hasProperty('gameTestPatternStorageJar')) {
    def storageJar = file(project.property('gameTestPatternStorageJar'))
    if (!storageJar.isFile() || !storageJar.name.endsWith('.jar'))
        throw new GradleException('gameTestPatternStorageJar must name a real Forge AE Omni Cells JAR')
    repositories.flatDir { dirs storageJar.parentFile }
    dependencies.add('localRuntime', fg.deobf("pack.local:${storageJar.name[0..-5]}:pattern-migration"))
}
if (gameTestSuite in ['essence', 'native-essence', 'machines', 'adaptive']) {
    def recipeModsDirectory = providers.gradleProperty('gameTestRecipeModsDir').orNull
    if (recipeModsDirectory == null) {
        throw new GradleException("The ${gameTestSuite} suite requires -PgameTestRecipeModsDir=<reference-pack mods directory>")
    }
    repositories.flatDir { dirs file(recipeModsDirectory) }
    def recipeMods = gameTestSuite in ['essence', 'native-essence']
            ? ['Cucumber-1.20.1-7.0.16', 'MysticalAgriculture-1.20.1-7.0.24',
               'MysticalAgradditions-1.20.1-7.0.12', 'matc-1.6.0']
            : gameTestSuite == 'adaptive' ? ['extendedae_plus-1.6.2']
            : ['AdvancedAE-1.3.6-1.20.1', 'geckolib-forge-1.20.1-4.8.4']
    recipeMods.each { name ->
        def dependency = fg.deobf("pack.local:${name}:reference")
        dependencies.add('localRuntime', dependency)
        if (gameTestSuite == 'adaptive') dependencies.add('gameTestCompileOnly', dependency)
    }
}
if (project.hasProperty('gameTestAdvanced')) {
    dependencies.add('localRuntime', fg.deobf('maven.modrinth:advancedae:1.3.6-1.20.1'))
    dependencies.add('localRuntime', fg.deobf('maven.modrinth:geckolib:4.8.4'))
}
tasks.named('compileGameTestJava', JavaCompile).configure {
    dependsOn tasks.named('classes')
    options.release.set(17)
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def log = gameTestDirectory.get().file('logs/latest.log').asFile
        if (!log.isFile() || !(log.text =~ /All [1-9][0-9]* required tests passed/))
            throw new GradleException("GameTests did not pass: ${gameTestSuite}")
    }
}

// Public contracts are documented independently from Minecraft implementation classes.
tasks.register('apiJavadoc', Javadoc) {
    source = sourceSets.main.allJava.matching {
        include 'com/atir/molecularmanipulator/api/crafting/**'
        include 'com/atir/molecularmanipulator/research/MatterResearchApi.java'
        include 'com/atir/molecularmanipulator/research/MatterResearchRecipe.java'
        include 'com/atir/molecularmanipulator/research/ResearchDepth.java'
    }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDir = layout.buildDirectory.dir('docs/api').get().asFile
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    dependsOn tasks.named('classes')
}
