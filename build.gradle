plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_artifact_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file(findProperty('run_directory') ?: 'run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// MixinGradle writes outside JavaCompile's normal output directories. Keep those
// outputs tracked and run the processor over all mixins when Java sources change.
def mixinRefmap = layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json")
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.files(mixinRefmap,
            layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'),
            layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
}
tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')
    from(mixinRefmap)
}
tasks.withType(Jar).configureEach {
    // MixinGradle also contributes the same generated file directly to reobfuscated jars.
    filesMatching("${mod_id}.refmap.json") { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
}

jarJar.enable()

tasks.named('jarJar', Jar).configure {
    archiveClassifier = project.hasProperty('ae2_uelm_version') ? 'uelm' : ''
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('CHANGELOG.md')
    from('docs') { into 'docs' }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
    exclude 'assets/examplemod/**'
}

repositories {
    flatDir { dirs 'libs' }

    maven {
        name = 'AE2UELM'
        url = 'https://repo.expandium.net/releases'
        content { includeGroup 'appeng' }
    }

    maven {
        name = 'MinecraftForgeReleases'
        url = 'https://maven.minecraftforge.net/releases/'
        content { includeGroup 'net.minecraftforge' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'org.appliedenergistics' }
    }
    maven {
        name = 'JaredMaven'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    mavenCentral()
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Use exactly one AE2 implementation on both compile and runtime classpaths.
    // A module coordinate lets ForgeGradle remap the production UELM jar.
    implementation fg.deobf(project.hasProperty('ae2_uelm_version')
            ? "appeng:appliedenergistics2-forge:${project.property('ae2_uelm_version')}"
            : "maven.modrinth:ae2:${ae2_version}")
    implementation fg.deobf("maven.modrinth:glodium:${glodium_version}")
    implementation fg.deobf("maven.modrinth:extended-ae:${extendedae_version}")
    implementation fg.deobf("maven.modrinth:guideme:${guideme_version}")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")

    // Separate required mods. Deobfuscate published Forge jars for development.
    implementation fg.deobf("com.appliedenhancements:appliedenhancements:${applied_enhancements_version}")

    testImplementation fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    testImplementation "io.github.llamalad7:mixinextras-common:${mixinextras_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    localRuntime "io.github.llamalad7:mixinextras-forge:${mixinextras_version}"
    jarJar("io.github.llamalad7:mixinextras-forge:[${mixinextras_version},)") {
        jarJar.pin(it, mixinextras_version)
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            applied_enhancements_version: applied_enhancements_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'    : mod_id,
                'Specification-Vendor'   : mod_authors,
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.jar.archiveVersion,
                'Implementation-Vendor'  : mod_authors,
                'MixinConfigs'           : "${mod_id}.mixins.json",
        ])
    }

    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('CHANGELOG.md')
    from('docs') { into 'docs' }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000', '-Xdiags:verbose']
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
    includeEmptyDirs = false
}

// Fail clearly before compiling against an older local prerequisite.
def verifyAppliedEnhancementsApi = tasks.register('verifyAppliedEnhancementsApi') {
    def dependencyJar = layout.projectDirectory.file("libs/appliedenhancements-${applied_enhancements_version}.jar")
    inputs.file(dependencyJar)
    doLast {
        def jarFile = dependencyJar.asFile
        if (!jarFile.isFile()) {
            throw new GradleException("Missing AppliedEnhancements dependency: " + jarFile + ". See libs/README.md")
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { archive ->
            if (archive.getEntry('com/appliedenhancements/api/AelisBatchExecutionContext.class') == null
                    || archive.getEntry('com/appliedenhancements/api/AelisSmartDoublingApi.class') == null) {
                throw new GradleException('The AppliedEnhancements JAR lacks the required updated 1.1.0-forge transaction/smart-doubling API. See libs/README.md')
            }
        }
    }
}
tasks.named('compileJava').configure { dependsOn verifyAppliedEnhancementsApi }

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Both distributable jars must use Forge runtime names.
reobf { jarJar {} }
tasks.named("jarJar").configure { finalizedBy "reobfJarJar" }
tasks.named("build").configure { dependsOn "jarJar" }

// Development runs use named Minecraft classes and can hide a missing refmap link.
// Validate the reobfuscated distributable, rather than only compiler output.
def verifyReleaseMixins = tasks.register('verifyReleaseMixins') {
    dependsOn tasks.named('reobfJarJar')
    def releaseJar = tasks.named('jarJar', Jar).flatMap { it.archiveFile }
    inputs.file(releaseJar)
    doLast {
        new java.util.zip.ZipFile(releaseJar.get().asFile).withCloseable { archive ->
            def parser = new groovy.json.JsonSlurper()
            def config = parser.parse(archive.getInputStream(archive.getEntry("${mod_id}.mixins.json")), 'UTF-8')
            def refmapName = "${mod_id}.refmap.json"
            if (config.refmap != refmapName || archive.getEntry(refmapName) == null) {
                throw new GradleException('Release Mixin configuration must reference the packaged Forge refmap')
            }
            def refmap = parser.parse(archive.getInputStream(archive.getEntry(refmapName)), 'UTF-8')
            [
                'SingularityEntityCollisionMixin': ['tick', 'm_8119_'],
                'SingularityPlayerCarriageMixin': ['tick', 'm_9933_'],
                'ForgeMachineRecipeJsonMixin': ['apply', 'm_5787_'],
                'ResponsiveScreenBackgroundMixin': ['renderBackground', 'm_280273_'],
                'RecipeManagerAccessor': ['byName', 'f_199900_']
            ].each { mixin, target ->
                def mapping = refmap.mappings["com/atir/molecularmanipulator/mixin/${mixin}"]?[target[0]]
                if (!(mapping instanceof String) || !mapping.contains(target[1])) {
                    throw new GradleException("Missing production Forge mapping for ${mixin}.${target[0]}")
                }
            }
        }
    }
}
tasks.named('check').configure { dependsOn verifyReleaseMixins }

// Public contracts are documented independently from Minecraft implementation classes.
tasks.register('apiJavadoc', Javadoc) {
    source = sourceSets.main.allJava.matching {
        include 'com/atir/molecularmanipulator/api/crafting/**'
        include 'com/atir/molecularmanipulator/research/MatterResearchApi.java'
        include 'com/atir/molecularmanipulator/research/MatterResearchRecipe.java'
        include 'com/atir/molecularmanipulator/research/ResearchDepth.java'
    }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDir = layout.buildDirectory.dir('docs/api').get().asFile
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    dependsOn tasks.named('classes')
}
