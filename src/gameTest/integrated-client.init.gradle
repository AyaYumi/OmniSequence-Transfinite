// Run the selected GameTest suite in a disposable integrated server.
allprojects { p ->
    p.afterEvaluate {
        if (!p.plugins.hasPlugin('net.minecraftforge.gradle')) return
        def suite = p.providers.gradleProperty('gameTestSuite').getOrElse('cpu')
        def instance = p.layout.buildDirectory.dir(p.providers.gradleProperty('gameTestRunName')
                .getOrElse("gametest-client-${suite}")).get().asFile
        def report = new File(instance, 'gametest-result.json')
        p.sourceSets.gameTest.java.include('**/IntegratedGameTestClient.java')
        p.minecraft.runs.client {
            workingDirectory instance
            property 'forge.enableGameTest', 'true'
            property 'forge.enabledGameTestNamespaces', 'molecularmanipulator'
            property 'molecularmanipulator.gameTestSuite', suite
            if (suite == 'eco-legacy') {
                // Named dev classes need no SRG refmap. In remap mode Mixin 0.8.5
                // incorrectly retries the old mod's absent six-argument overload by name alone.
                property 'mixin.env.remapRefMap', 'false'
                property 'mixin.env.disableRefMap', 'true'
            }
            mods { molecularmanipulator { source p.sourceSets.gameTest } }
        }
        p.tasks.matching { it.name == 'runClient' }.configureEach {
            doFirst { report.delete() }
            doLast {
                if (!report.isFile() || new groovy.json.JsonSlurper().parse(report).passed != true) {
                    throw new GradleException("Integrated GameTests failed: ${suite}; see ${report}")
                }
            }
        }
    }
}
