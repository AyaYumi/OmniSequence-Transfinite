// Compare upstream AE2 and UELM using the same paired-mod runtime assertions.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def compatibilityRun = (project.findProperty('ae2CompatibilityRunName') ?: 'ae2-compat-server-run').toString()
        if (!(compatibilityRun ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid compatibility run directory')
        def regression = sourceSets.create('ae2ServerCompatibility') {
            java.srcDirs project.file('tools/gametest/ae2-compat'), project.file('tools/gametest/java')
            java.include '**/Ae2CompatibilityGameTests.java', '**/MolecularLongBatchGameTests.java', '**/SmartDoublingGameTests.java', '**/NativeArithmeticGameTests.java', 'com/extendedae_plus/**/*.java', 'com/sorrowmist/**/*.java'
            resources.srcDir project.file('tools/gametest/resources')
            resources.exclude 'data/molecularmanipulator/recipes/**'
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/' + compatibilityRun)
            mods { "${project.mod_id}" { source regression } }
        }
        tasks.named('compileAe2ServerCompatibilityJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
        }
        def compatibilityLog = project.file('build/' + compatibilityRun + '/logs/latest.log')
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def report = compatibilityLog.text
                if (!report.contains('All 4 required tests passed'))
                    throw new GradleException('Paired-mod AE2 compatibility checks did not pass')
            }
        }
    }
}
