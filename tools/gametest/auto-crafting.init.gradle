// Regression suites run only in disposable directories under build/.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def verification = sourceSets.create('autoCraftingRegression') {
            java.srcDir project.file('tools/gametest/java')
            java.include '**/MolecularAutoCraftGameTests.java'
            resources.srcDir project.file('tools/gametest/resources')
            resources.exclude 'data/molecularmanipulator/recipes/**'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        minecraft.runs.gameTestServer {
            workingDirectory project.file('build/auto-crafting-regression-run')
            property 'forge.logging.console.level', 'info'
            mods { "${project.mod_id}" { source verification } }
        }
        tasks.named('compileAutoCraftingRegressionJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(17)
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                if (!project.file('build/auto-crafting-regression-run/logs/latest.log').text.contains('All 5 required tests passed'))
                    throw new GradleException('auto-crafting required checks did not pass')
            }
        }
    }
}
