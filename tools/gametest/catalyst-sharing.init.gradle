// Shared catalysts, real recipe import and durable ownership in an isolated world.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def pack = project.findProperty('catalystForgeJars')
        if (pack) throw new GradleException('Use cpu-batch-compat.init.gradle with cpuCompatJars for matching Forge CPU runtimes; this suite validates native catalyst ownership.')
        def verification = sourceSets.create('catalystSharingVerification') {
            java.srcDir project.file('tools/gametest/java')
            java.include '**/MatterCatalystGameTests.java', '**/VerificationAEKey.java'
            resources.srcDir project.file('tools/gametest/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        minecraft.runs.configureEach { mods { "${project.mod_id}" { source verification } } }
        def runName = pack ? 'catalyst-sharing-lightning' : 'catalyst-sharing'
        minecraft.runs.getByName('gameTestServer').workingDirectory = project.file('build/' + runName)
        minecraft.runs.getByName('gameTestServer').property "forge.logging.console.level", "info"
        tasks.named('compileCatalystSharingVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(17)
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                if (!project.file('build/' + runName + '/logs/latest.log').text.contains('All 1 required tests passed'))
                    throw new GradleException('Catalyst sharing checks did not pass')
            }
        }
    }
}
