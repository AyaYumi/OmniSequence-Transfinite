// Focused single-block production and portable-inventory regression in a disposable world.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def verification = sourceSets.create('compactSingularityVerification') {
            java.srcDir file('tools/gametest/java')
            java.include '**/CompactSingularityGameTests.java'
            resources.srcDir file('tools/gametest/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(verification)
        neoForge.runs.getByName('gameTestServer').gameDirectory = file('build/compact-singularity-regression-run')
        neoForge.runs.getByName('gameTestServer').logLevel = org.slf4j.event.Level.INFO
        tasks.named('compileCompactSingularityVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
    }
}
