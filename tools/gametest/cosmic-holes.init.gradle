// Team-bound miniature-hole routing, in a disposable world.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def verification = sourceSets.create('cosmicHolesVerification') {
            java.srcDir project.file('tools/gametest/java')
            java.include '**/CosmicHoleGameTests.java', '**/FtbTeamFixture.java'
            resources.srcDir project.file('tools/gametest/resources')
            resources.exclude 'data/molecularmanipulator/recipes/**'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        if (project.hasProperty('cosmicFtbTests')) {
            def pack = project.findProperty('ftbPackMods')
            if (!pack) throw new GradleException('ftbPackMods must point to matching Forge 1.20.1 dependencies')
            ['ftb-teams-forge-2001*.jar', 'ftb-library-forge-2001*.jar', 'architectury-*-forge.jar'].each { pattern ->
                def jar = project.fileTree(pack).matching { include pattern }.singleFile
                repositories.flatDir { dirs jar.parentFile }
                dependencies.add('localRuntime', fg.deobf("local.ftb:${jar.name[0..-5]}:1"))
            }
        }
        minecraft.runs.configureEach { mods { "${project.mod_id}" { source verification } } }
        minecraft.runs.getByName('gameTestServer').workingDirectory = project.file(
                project.hasProperty('cosmicFtbTests')
                        ? 'build/cosmic-holes-ftb-regression-run' : 'build/cosmic-holes-regression-run')
        minecraft.runs.getByName('gameTestServer').property "forge.logging.console.level", "info"
        tasks.named('compileCosmicHolesVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(17)
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doLast {
                def directory = minecraft.runs.getByName('gameTestServer').workingDirectory
                def log = new File(directory, 'logs/latest.log').text
                if (!(log =~ /All [1-9][0-9]* required tests passed/))
                    throw new GradleException('No successful required game tests in cosmic-holes')
            }
        }
    }
}
