// Real optional CPU APIs, isolated from production and the player's pack.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        apply from: file('tools/gametest/cpu-compat-runtime.gradle')
        def regression = sourceSets.create('cpuBatchCompatibility') {
            java.srcDir file('tools/gametest/java')
            java.include '**/MatterCpuBatchGameTests.java', '**/MatterNativeCpuChecks.java', '**/VerificationAEKey.java'
            resources.srcDir file('tools/gametest/resources')
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(regression)
        def server = neoForge.runs.getByName('gameTestServer')
        def runName = (project.findProperty('cpuCompatRunName') ?: 'cpu-batch-compat').toString()
        if (!(runName ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid CPU compatibility run name')
        server.gameDirectory = file('build/' + runName)
        server.logLevel = org.slf4j.event.Level.INFO
        tasks.named('compileCpuBatchCompatibilityJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
        tasks.named('runGameTestServer').configure {
            doLast {
                if (!file('build/' + runName + '/logs/latest.log').text.contains('All 1 required tests passed'))
                    throw new GradleException('Matter CPU batch compatibility checks did not pass')
            }
        }
    }
}
