// Applied only by isolated CPU init scripts. Never copy an entire player mods directory.
def enabled = (project.findProperty('cpuCompatMods') ?: '').toString().split(',')
        .collect { it.trim() }.findAll { it }
def runName = (project.findProperty('cpuCompatRunName') ?: 'cpu-batch-compat').toString()
if (!(runName ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid CPU compatibility run name')
def packPath = project.findProperty('cpuCompatPackMods')
def pack = packPath ? file(packPath) : null
def selectPackJar = { String pattern ->
    if (pack == null || !pack.isDirectory())
        throw new GradleException('cpuCompatPackMods must point to a readable mods directory')
    def matches = fileTree(pack).matching { include pattern }.files.toList()
    if (matches.size() != 1)
        throw new GradleException('Expected exactly one ' + pattern + ' in ' + pack + ', found ' + matches.size())
    matches.first()
}
def runtime = []
if (project.findProperty('cpuCompatAppliedJar')) {
    def applied = selectPackJar(project.property('cpuCompatAppliedJar').toString())
    configurations.localRuntime.dependencies.removeAll { dependency ->
        dependency instanceof org.gradle.api.artifacts.FileCollectionDependency
                && dependency.files.files.any { it.name.startsWith('appliedenhancements-') }
    }
    runtime += applied
}
def eco = null
if (enabled.contains('eco')) {
    eco = project.findProperty('cpuCompatEcoJar')
            ? selectPackJar(project.property('cpuCompatEcoJar').toString())
            : file("libs/neoecoae-${project.neoeco_version}.jar")
    runtime += eco
}
if (enabled.contains('thunderbolt')) runtime += project.findProperty('cpuCompatThunderboltJar')
        ? selectPackJar(project.property('cpuCompatThunderboltJar').toString())
        : file('libs/thunderbolt-2.0.0-beta.4.jar')
if (enabled.contains('data')) runtime += file('libs/data_energistics-3.3.0-api.jar')
if (enabled.contains('lightning')) runtime += selectPackJar(
        (project.findProperty('cpuCompatLightningJar') ?: 'ae2lt-2.1.0-beta.6.jar').toString())

def extended = null
if (project.findProperty('cpuCompatExtendedJar')) {
    extended = selectPackJar(project.property('cpuCompatExtendedJar').toString())
    configurations.implementation.dependencies.removeAll {
        it.group == 'curse.maven' && it.name.startsWith('ex-pattern-provider-')
    }
    dependencies.add('compileOnly', files(extended))
}

def ldlib = null
if (enabled.contains('eco') || enabled.contains('data') || enabled.contains('lightning')) {
    ldlib = selectPackJar('ldlib2-neoforge-' + project.minecraft_version + '-*-all.jar')
    new java.util.zip.ZipFile(ldlib).withCloseable { archive ->
        def metadata = archive.getEntry('META-INF/neoforge.mods.toml')
        if (metadata == null) throw new GradleException('Missing NeoForge metadata in ' + ldlib)
        def text = archive.getInputStream(metadata).withCloseable { it.getText('UTF-8') }
        def version = text =~ /(?m)^\s*version\s*=\s*"(\d+)\.(\d+)\.(\d+)"\s*(?:#.*)?$/
        if (!version.find()) throw new GradleException('Cannot read LDLib version from ' + ldlib)
        def numbers = (1..3).collect { version.group(it).toInteger() }
        if (numbers[0] < 2 || (numbers[0] == 2 && numbers[1] < 2)
                || (numbers[0] == 2 && numbers[1] == 2 && numbers[2] < 40))
            throw new GradleException('ECO/Data CPU tests require ldlib2 >= 2.2.40: ' + ldlib)
    }
    // Its all JAR embeds Taffy, Yoga and Kotlin. ECO embeds Registrate.
    configurations.implementation.dependencies.removeAll { it.group == 'com.lowdragmc.ldlib2' }
}

// Explicit extras only, for tests that opt into another integration and its prerequisites.
(project.findProperty('cpuCompatExtraMods') ?: '').toString().split(',')
        .collect { it.trim() }.findAll { it }.each { name ->
    if (name.contains('/') || name.contains('\\') || name.contains('*') || name.contains('?') || !name.endsWith('.jar'))
        throw new GradleException('cpuCompatExtraMods must contain JAR filenames only: ' + name)
    runtime += selectPackJar(name)
}
def originals = (runtime + (ldlib == null ? [] : [ldlib]) + (extended == null ? [] : [extended])).unique()
ext.cpuCompatRuntimeFiles = files(originals)
originals.each { if (!it.isFile()) throw new GradleException('Missing CPU runtime: ' + it) }
if (eco != null) {
    new java.util.zip.ZipFile(eco).withCloseable { archive ->
        def metadata = archive.getEntry('META-INF/neoforge.mods.toml')
        if (metadata == null) throw new GradleException('Missing NeoForge metadata in ' + eco)
        def text = archive.getInputStream(metadata).withCloseable { it.getText('UTF-8') }
        def version = text =~ /(?m)^\s*version\s*=\s*"(\d+)\.(\d+)\.(\d+)"\s*(?:#.*)?$/
        if (!(text =~ /(?m)^\s*modId\s*=\s*"neoecoae"\s*(?:#.*)?$/).find() || !version.find())
            throw new GradleException('Cannot read ECO runtime identity/version from ' + eco)
        def numbers = (1..3).collect { version.group(it).toInteger() }
        def minimum = project.neoeco_version.toString().split('\\.').collect { it.toInteger() }
        def difference = (0..2).find { numbers[it] != minimum[it] }
        if (difference != null && numbers[difference] < minimum[difference])
            throw new GradleException('ECO runtime must be >= ' + project.neoeco_version + ': ' + eco)
    }
}
def staging = layout.buildDirectory.dir('cpu-compat-runtime/' + runName)
def prepareRuntime = tasks.register('prepareCpuCompatibilityRuntime', Sync) {
    from originals
    into staging
}
def staged = { File original ->
    files(staging.map { it.file(original.name) }).builtBy(prepareRuntime)
}
runtime.each { dependencies.add('localRuntime', staged(it)) }
if (ldlib != null) dependencies.add('implementation', staged(ldlib))
if (extended != null) dependencies.add('implementation', staged(extended))
