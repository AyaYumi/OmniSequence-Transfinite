// Gravity Crystal and Ghost Matter regressions in a disposable server world.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def verification = sourceSets.create('outerWildsVerification') {
            java.srcDir file('tools/gametest/java')
            java.include '**/OuterWildsGameTests.java'
            resources.srcDir file('tools/gametest/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(verification)
        def run = neoForge.runs.getByName('gameTestServer')
        run.gameDirectory = file('build/outer-wilds-gametest')
        run.logLevel = org.slf4j.event.Level.INFO
        tasks.named('compileOuterWildsVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
        tasks.named('runGameTestServer').configure {
            doLast {
                def marker = 'All 7 required tests passed'
                if (!new File(run.gameDirectory.get().asFile, 'logs/latest.log').text.contains(marker))
                    throw new GradleException('Outer Wilds verification did not pass: ' + marker)
            }
        }
    }
}
