// Paired integration tests for the current AppliedEnhancements development API.
// Select its JAR with -Papplied_enhancements_api_build; baseline tests use applied-110.init.gradle.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def compatibilityRun = (project.findProperty('ae2CompatibilityRunName') ?: 'ae2-compat-server-run').toString()
        if (!(compatibilityRun ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid compatibility run directory')
        def regression = sourceSets.create('ae2ServerCompatibility') {
            java.srcDirs file('tools/gametest/ae2-compat'), file('tools/gametest/java')
            java.include '**/Ae2CompatibilityGameTests.java', '**/MolecularLongBatchGameTests.java', '**/SmartDoublingGameTests.java', '**/NativeArithmeticGameTests.java', '**/SelectedInterceptionGameTests.java', 'com/extendedae_plus/**/*.java', 'com/sorrowmist/**/*.java'
            resources.srcDir file('tools/gametest/resources')
            resources.exclude 'data/molecularmanipulator/recipe/**'
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(regression)
        def server = neoForge.runs.getByName('gameTestServer')
        server.gameDirectory = file('build/' + compatibilityRun)
        server.logLevel = org.slf4j.event.Level.INFO
        def compatibilityLog = project.file('build/' + compatibilityRun + '/logs/latest.log')
        tasks.named('runGameTestServer').configure {
            doLast {
                def report = compatibilityLog.text
                if (!report.contains('All 7 required tests passed'))
                    throw new GradleException('Paired-mod AE2 compatibility checks did not pass')
            }
        }
        tasks.named('compileAe2ServerCompatibilityJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
    }
}
