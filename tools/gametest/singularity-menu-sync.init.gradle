// Menu codecs, resource lists and collection settings. See tools/gametest/README.md#hub-resource-list-synchronization for commands and required markers.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def verification = sourceSets.create('singularityMenuSyncVerification') {
            java.srcDir file('tools/gametest/java')
            java.include '**/SingularityMenuSyncGameTests.java'
            java.include '**/SingularityCollectionGameTests.java'
            resources.srcDir file('tools/gametest/resources')
            resources.include 'data/molecularmanipulator/structure/multiblock_dismantle_empty.nbt'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(verification)
        neoForge.runs.getByName('gameTestServer').gameDirectory = file('build/' +
                project.providers.gradleProperty('singularityMenuSyncRunName').getOrElse('singularity-menu-sync-run'))
        neoForge.runs.getByName('gameTestServer').logLevel = org.slf4j.event.Level.INFO
        tasks.named('compileSingularityMenuSyncVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
    }
}
