// Isolated registration/loot test, with no access to a personal game world.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def verification = sourceSets.create('singularityVerification') {
            java.srcDir file('tools/gametest/java')
            java.include '**/SingularityPaletteGameTests.java'
            java.include '**/SingularityConstructionGameTests.java'
            java.include '**/SingularityMotionGameTests.java'
            java.include '**/SingularityEmbeddingGameTests.java'
            java.include '**/SingularitySuspendedGameTests.java'
            resources.srcDir file('tools/gametest/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(verification)
        neoForge.runs.getByName('gameTestServer').gameDirectory = file(project.findProperty('singularityRegressionDirectory') ?: 'build/singularity-regression-run')
        neoForge.runs.getByName('gameTestServer').logLevel = org.slf4j.event.Level.INFO
        tasks.named('compileSingularityVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
    }
}
