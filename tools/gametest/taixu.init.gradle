// Isolated registration/loot test, with no access to a personal game world.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def verification = sourceSets.create('taixuVerification') {
            java.srcDir file('tools/gametest/java')
            java.include '**/TaixuPaletteGameTests.java'
            java.include '**/TaixuConstructionGameTests.java'
            java.include '**/TaixuMotionGameTests.java'
            java.include '**/TaixuEmbeddingGameTests.java'
            java.include '**/TaixuSuspendedGameTests.java'
            resources.srcDir file('tools/gametest/resources')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(verification)
        neoForge.runs.getByName('gameTestServer').gameDirectory = file('build/taixu-regression-run')
        tasks.named('compileTaixuVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
    }
}
