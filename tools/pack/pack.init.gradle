// A combined, reobfuscated test-only archive for installed Forge packs.
// Main classes provide inheritance mappings; fixtures never enter the release JAR.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        dependencies.add('implementation', fg.deobf("curse.maven:advancedae-${advancedae_curse_project}:${advancedae_curse_file}"))
        def generated = layout.buildDirectory.dir('pack-verification-sources')
        def prepare = tasks.register('preparePackVerificationSources', Sync) {
            into generated
            from('tools/gametest/java')
            from('tools/gametest/aae')
            from('tools/client/java')
            from('tools/pack/java')
            from('tools/gametest/ae2-compat') { include '**/Ae2CompatibilityGameTests.java' }
            filter { line -> line.replace('modid = "molecularmanipulator"', 'modid = "omniverification"') }
        }
        def verification = sourceSets.create('packVerification') {
            java.srcDir generated
            resources.setSrcDirs([project.file('tools/pack/resources'), project.file('tools/gametest/resources')])
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        tasks.named('compilePackVerificationJava', JavaCompile) {
            dependsOn prepare, tasks.named('classes')
            options.encoding = 'UTF-8'
        }
        def fixtureJar = tasks.register('packVerificationJar', Jar) {
            archiveBaseName = 'omni-pack-verification'
            archiveVersion = '1'
            // Include main classes before reobfuscation so inherited Minecraft
            // overrides on our own classes receive the same production names.
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from(sourceSets.main.output) { exclude 'META-INF/mods.toml' }
            from(verification.output) { exclude 'META-INF/mods.toml' }
            def descriptor = layout.buildDirectory.file('pack-verification-metadata/mods.toml')
            from(descriptor) { into 'META-INF' }
            includeEmptyDirs = false
            doFirst {
                def target = descriptor.get().asFile
                target.parentFile.mkdirs()
                def extra = project.file('tools/pack/resources/META-INF/mods.toml').text
                target.text = project.file('build/resources/main/META-INF/mods.toml').text + '\n[[mods]]' + extra.split('\\[\\[mods\\]\\]', 2)[1]
            }
            finalizedBy 'reobfPackVerificationJar'
        }
        reobf { packVerificationJar {} }
    }
}
