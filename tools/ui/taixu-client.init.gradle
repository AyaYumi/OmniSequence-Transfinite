// Real client smoke run in a copied, disposable GameTest world. No personal worlds.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        dependencies.add('localRuntime', "mezz.jei:jei-1.21.1-neoforge:${project.jei_version}")
        def renderMods = project.findProperty('taixuRenderMods')
        if (renderMods) {
            def patterns = ['sodium-neoforge-*.jar', 'iris-neoforge-*.jar',
                'entityculling-neoforge-*.jar', 'ImmediatelyFast-NeoForge-*.jar', 'acceleratedrendering-*.jar',
                'sodiumextras-neoforge-*.jar']
            def jars = fileTree(dir: renderMods, includes: patterns)
            if (jars.files.size() != patterns.size()) throw new GradleException('Expected six explicit render compatibility mods')
            // Keep distribution jars intact: normal discovery handles nested mod libraries.
            def runDirectory = file(project.findProperty('taixuUiDirectory') ?: 'build/taixu-client-run')
            copy { from jars; into new File(runDirectory, 'mods') }
        }
        def verification = sourceSets.create('taixuClientVerification') {
            java.srcDir file('tools/ui/java')
            java.include '**/TaixuClientProbe.java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
        neoForge.mods.getByName(project.mod_id).sourceSet(verification)
        neoForge.runs.getByName('client').gameDirectory = file(project.findProperty('taixuUiDirectory') ?: 'build/taixu-client-run')
        neoForge.runs.getByName('client').programArguments.addAll('--quickPlaySingleplayer', project.findProperty('taixuUiWorld') ?: 'TaixuUI', '--width', '1600', '--height', '1000')
        neoForge.runs.getByName('client').systemProperty('taixu.probe.output', file(project.findProperty('taixuUiOutput') ?: 'build/taixu-palette').absolutePath)
        neoForge.runs.getByName('client').systemProperty('taixu.probe.flicker', project.findProperty('taixuFlickerProbe') ?: 'false')
        neoForge.runs.getByName('client').systemProperty('taixu.probe.tianyi', project.findProperty('taixuTianyiProbe') ?: 'false')
        neoForge.runs.getByName('client').systemProperty('taixu.probe.embedded', project.findProperty('taixuEmbeddedProbe') ?: 'false')
        neoForge.runs.getByName('client').systemProperty('taixu.probe.suspended', project.findProperty('taixuSuspendedProbe') ?: 'false')
        tasks.named('compileTaixuClientVerificationJava', JavaCompile) {
            dependsOn tasks.named('classes')
            options.encoding = 'UTF-8'
            options.release.set(21)
        }
    }
}
