// Compile the preview against the installed release while other features are being edited.
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        def baseline = file(property('taixuBaselineJar'))
        def patched = ['**/entity/TaixuAssemblyEntity*', '**/client/TaixuRenderer*',
                       '**/client/render/TaixuStructureEffects*', '**/client/render/TaixuEffectState*',
                       '**/client/render/TaixuEffectLayers*']
        def classes = file('build/taixu-tianyi-classes')
        def resources = file('build/taixu-tianyi-resources')
        def prepare = tasks.register('prepareTaixuEffectsBaseline') {
            inputs.file baseline
            outputs.dir resources
            doLast {
                copy {
                    from zipTree(baseline)
                    exclude '**/*.class', 'META-INF/MANIFEST.MF'
                    into resources
                }
            }
        }
        sourceSets.main.java.setIncludes(patched.collect { it + '.java' })
        sourceSets.main.compileClasspath += files(baseline)
        sourceSets.main.output.classesDirs.setFrom(classes)
        sourceSets.main.resources.setSrcDirs([resources])
        tasks.named('createMinecraftArtifacts') { dependsOn prepare }
        tasks.named('processResources') { dependsOn prepare }
        tasks.named('compileJava', JavaCompile) {
            destinationDirectory.set(classes)
            doLast {
                copy {
                    from zipTree(baseline)
                    include '**/*.class'
                    exclude patched.collect { it + '.class' }
                    into classes
                }
            }
        }
        sourceSets.test.java.setIncludes(['**/RecordingColorConsumer.java',
                '**/TaixuStructureEffectsTest.java', '**/TaixuEffectStateTest.java'])
        tasks.register('assembleTaixuEffectsPatch', Zip) {
            dependsOn tasks.named('classes')
            archiveFileName.set('omnisequence-transfinite-2.0.7-taixu-tianyi-preview.jar')
            destinationDirectory.set(file('build/libs'))
            from(zipTree(baseline)) { exclude patched.collect { it + '.class' } }
            from(classes) { include patched.collect { it + '.class' } }
        }
    }
}
